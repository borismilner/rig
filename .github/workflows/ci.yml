# CI runs the same targets a human does (PLAN.md section 28).
#
# Nothing is defined here that is not a Makefile target, because a workflow
# that reassembles the gate out of raw go commands is a second definition of
# it, and the two drift. Every step below is `make <target>`, and what CI
# checks changes by changing the Makefile.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history, because the Makefile's VERSION comes from
          # `git describe --tags`. A shallow clone has no tags, that falls
          # back to "dev", and the string length reaches the binary through
          # -ldflags -X, which is a number `make bench-size` ratchets.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          # From go.mod, so the toolchain version lives in one place. The
          # size ratchet is only meaningful against a fixed toolchain: with
          # -trimpath and the same version, the build is reproducible.
          go-version-file: go.mod
          check-latest: false

      - name: install golangci-lint
        # Pinned, because a newer linter finds new things and turns the build
        # red on a day nothing changed. Moving this is a decision, and it
        # shows up in the diff as one.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: make ci
        run: make ci

      - name: make lint
        run: make lint

      - name: make modules-matrix
        run: make modules-matrix

      - name: make contrast
        # Section 20's "a failing ratio fails the build" was prose until this
        # step existed: the target it needed had never been written, and no
        # workflow called it. Its own step rather than part of `make ci` for the
        # same reason as lint - it needs something the runner provides (Chrome
        # at /usr/bin/google-chrome) and `make ci` must not assume a machine has
        # it. The target self-tests its instruments against known answers first,
        # because a contrast script that lies certifies defects.
        run: make contrast

      - uses: actions/setup-node@v4
        # AFTER `make contrast` on purpose. That step runs on whatever node the
        # runner image ships and has never had a pin; putting setup-node above
        # it would silently change the node its measurements come from, which
        # is a change to the gate disguised as a change to the workflow. The
        # window's page is the only thing here that needs a node_modules tree.
        #
        # Pinned to a major rather than read from a file because the frontend
        # declares no engines field. If one is ever added, delete the literal
        # and use node-version-file, so the version lives in one place the way
        # the Go toolchain already does.
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: make deps-frontend
        run: make deps-frontend

      - name: make contrast-window
        # The shell's own page, which section 20's gate could not see at all
        # until the page existed. Its own step for the same reason as contrast:
        # it needs Chrome from the runner image, and now a node_modules tree as
        # well, and `make ci` must not assume a machine has either.
        #
        # This can run here while `bench-size-window` cannot, and the reason is
        # the split in the Makefile: contrast-window depends on build-frontend,
        # which is pure node, while the window BINARY needs cgo, gtk3 and
        # webkit2gtk, none of which ubuntu-latest carries. So the page is
        # measured in CI and the binary's size row is still only guarded by
        # hand - that gap is real and is not closed by this step.
        run: make contrast-window

      # Not here, and each for a reason:
      #
      #   bench-ipc     a measurement. A shared runner cannot reproduce
      #                 section 4's numbers, and a benchmark that reports
      #                 whatever the neighbour VM left it is worse than none.
      #   cover verify modules test-wire bench-idle
      #                 waiting on the milestone that gives each something to
      #                 check. `make ci` prints the list and why.
