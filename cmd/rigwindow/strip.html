<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rig status</title>
<style>
:root{color-scheme:dark light;--glass:rgba(20,25,32,.97);--line:rgba(255,255,255,.22);--fg:#d8e1ec;--dim:#b4c1d0;--info:#8fc2fb;--on-info:#0d1117;--good:#92cf9a;--warn:#e9bd78;--bad:#f7a59c;--sans:Inter,Cantarell,ui-sans-serif,system-ui,sans-serif}
@media(prefers-color-scheme:light){:root{--glass:rgba(246,248,251,.98);--line:rgba(38,51,65,.28);--fg:#263341;--dim:#4c5a68;--info:#2f577f;--on-info:#fff;--good:#297029;--warn:#75622b;--bad:#8e3024}}
*{box-sizing:border-box}html,body{margin:0;width:100%;background:transparent;color:var(--fg);font:14px/1.4 var(--sans);overflow:hidden}body{padding:0}#panel{width:100%;background:var(--glass);border:1px solid var(--line);border-radius:0;box-shadow:0 5px 20px #0008;padding:8px 14px;display:grid;gap:7px}.row{min-height:42px;display:flex;align-items:center;gap:12px}.main{flex:1;min-width:0}.label{color:var(--info);font-size:12px;font-weight:750;letter-spacing:.04em}.title{font-weight:650;font-size:15px;overflow-wrap:anywhere}.meta{color:var(--dim);overflow-wrap:anywhere}.statuses{display:grid;gap:5px}.status{display:flex;align-items:flex-start;gap:10px;border-top:1px solid var(--line);padding-top:7px;white-space:pre-wrap;overflow-wrap:anywhere}.status .text{flex:1;min-width:0}.owner{color:var(--dim);font-size:12px;white-space:nowrap}.controls{display:flex;gap:6px;align-items:center;flex-shrink:0}button{font:600 13px/1 var(--sans);min-height:34px;padding:0 12px;border-radius:8px;color:var(--fg);background:#ffffff0e;border:1px solid #ffffff2b;cursor:pointer}button:hover{background:#ffffff20}button.primary{color:var(--on-info);background:var(--info);border-color:transparent}button.danger{color:var(--bad)}button.edge{min-width:86px}.error{color:var(--bad);font-size:12px}#statuses:empty{display:none}
</style></head>
<body><main id="panel" role="region" aria-label="Rig status panel">
<section id="hand" class="row" hidden><div class="main"><div id="phase" class="label"></div><div id="title" class="title"></div><div id="meta" class="meta"></div><div id="err" class="error"></div></div><div id="buttons" class="controls"></div></section>
<section id="statuses" class="statuses" aria-live="polite"></section>
<div class="row" style="min-height:34px;justify-content:flex-end"><button id="edge" class="edge" type="button">Move to top</button></div>
</main>
<script>
"use strict";const $=id=>document.getElementById(id);let key="",lastHeight=0,atTop=false;
function dur(ms){const s=Math.max(0,Math.ceil(ms/1000));return s<60?s+"s":Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
const join=(...x)=>x.filter(Boolean).join(" · ");
const phases={
 asking:s=>["STARTS IN "+dur(s.left_ms),s.holder+" wants the desktop",join(s.reason,"starts unless you answer"),[["allow","Allow now","primary"],["hold","Hold",""],["decline","Decline","danger"]]],
 held:s=>["ON HOLD · "+dur(s.held_ms)+" left",s.holder+" is waiting",join(s.reason,"declines in "+dur(s.left_ms)),[["resume","Let it run","primary"],["decline","Decline","danger"]]],
 driving:s=>["HANDS OFF · "+dur(s.since_ms),s.note||s.holder+" is driving",join(s.activity,s.reason),[["pause","Take back","primary"],["stop","Stop","danger"]]],
 paused:s=>["PAUSED · ends in "+dur(s.left_ms),"The desktop is yours again",join(s.holder,s.note),[["resume","Resume","primary"],["stop","Stop","danger"]]],
 grant_asking:s=>["REQUESTED · "+dur(s.grant_window_ms)+" access · expires in "+dur(s.grant_left_ms),s.grant_seat+" requests desktop control",join(s.grant_reason,s.grant_scope?"Only window titled “"+s.grant_scope+"”":"","Silence declines"),[["accept","Accept "+dur(s.grant_window_ms),"primary"],["decline","Decline","danger"]]],
 grant_live:s=>["CONTROL GRANTED · "+dur(s.grant_left_ms)+" left",s.grant_seat+" has desktop control",join(s.grant_reason,s.grant_scope),[["pause","Take back","primary"],["stop","Stop","danger"]]],
 idle:s=>["RECENTLY ENDED",s.holder+": "+(s.ended||"over"),"",[]]
};
async function post(path){const r=await fetch(path,{method:"POST"});if(!r.ok)$("err").textContent=(await r.text()).trim();poll()}
function draw(s){atTop=s.at_top;$("edge").textContent=atTop?"Move to bottom":"Move to top";let phase=s.phase;if(phase==="idle"&&s.grant_phase)phase="grant_"+s.grant_phase;const active=phase!=="idle"||s.holder||s.ended;$("hand").hidden=!active;if(active){const [a,b,c,buttons]=(phases[phase]||phases.idle)(s);$("phase").textContent=a;$("title").textContent=b;$("meta").textContent=c;const k=phase+buttons.map(x=>x[0]).join();if(k!==key){key=k;$("buttons").replaceChildren(...buttons.map(([word,label,cls])=>{const x=document.createElement("button");x.type="button";x.textContent=label;x.className=cls;x.onclick=()=>post("/strip/answer?action="+word);return x}))}}
const host=$("statuses"),ids=s.statuses.map(x=>x.id).join("|");if(host.dataset.ids!==ids||host.dataset.text!==s.statuses.map(x=>x.text+x.owner).join("\n")){host.dataset.ids=ids;host.dataset.text=s.statuses.map(x=>x.text+x.owner).join("\n");host.replaceChildren(...s.statuses.map(x=>{const row=document.createElement("div");row.className="status";const text=document.createElement("div");text.className="text";text.textContent=x.text;const owner=document.createElement("span");owner.className="owner";owner.textContent=x.owner;const btn=document.createElement("button");btn.type="button";btn.className="danger";btn.textContent="Dismiss";btn.setAttribute("aria-label","Dismiss update from "+x.owner);btn.onclick=()=>post("/strip/status/remove?id="+encodeURIComponent(x.id));row.append(text,owner,btn);return row}))}
requestAnimationFrame(()=>{const h=Math.ceil($("panel").getBoundingClientRect().height);if(h!==lastHeight){lastHeight=h;fetch("/strip/resize",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({height:h})})}})}
async function poll(){try{const r=await fetch("/strip/poll");draw(await r.json())}catch{}}
$("edge").onclick=()=>post("/strip/edge");setInterval(poll,500);poll();
</script></body></html>
