<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rig - management dashboard (mockup)</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:var(--fs-0)/var(--lh) var(--sans);letter-spacing:var(--tight-ui)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--h-steel);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono)}
.dim{color:var(--fg-dim)}
.faint{color:var(--fg-faint)}

/* the shell: the rail is its own grid track, as in the window */
.shell{display:grid;grid-template-columns:56px 1fr;height:100vh}
.rail{background:var(--bg-2);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0}
.rail button{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--fg-dim)}
.rail button[aria-current="true"]{background:var(--panel);color:var(--fg);box-shadow:inset 0 0 0 1px var(--border)}
.rail svg{width:20px;height:20px}
.rail .gap{flex:1}
.main{display:grid;grid-template-rows:auto 1fr auto;min-width:0;min-height:0}

/* the tab strip: Main always, a tab per program or agent only on request */
.tabs{display:flex;align-items:stretch;gap:2px;padding:8px 12px 0;border-bottom:1px solid var(--border);background:var(--bg-2)}
.tab{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:10px 10px 0 0;color:var(--fg-dim);border:1px solid transparent;border-bottom:0;position:relative;top:1px;max-width:240px}
.tab[aria-selected="true"]{background:var(--bg);color:var(--fg);border-color:var(--border)}
.tab .who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .kind{font-size:var(--fs--2);color:var(--fg-faint);text-transform:uppercase;letter-spacing:.06em}
.tab .x{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--fg-dim)}
.tab .x:hover{background:var(--tint)}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--sev,var(--fg-faint))}
.tab.fresh{animation:fresh 1.6s ease-out 2}
@keyframes fresh{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--h-steel) 60%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.tabs .spacer{flex:1}
.tool{display:flex;align-items:center;gap:6px;padding:6px 10px;margin-bottom:6px;border-radius:8px;color:var(--fg-dim);border:1px solid var(--border)}
.tool:hover{color:var(--fg);background:var(--panel)}
.tool b{color:var(--fg);font-weight:600}
.tool svg{width:16px;height:16px}

/* menus and drawers */
.menu{position:absolute;right:12px;top:48px;z-index:20;min-width:320px;background:var(--panel);border:1px solid var(--border-2);border-radius:var(--radius);padding:6px;box-shadow:0 12px 40px rgb(0 0 0 / .35)}
.menu h5{margin:6px 8px;font-size:var(--fs--1);color:var(--fg-dim);font-weight:600}
.menu button{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;padding:8px;border-radius:8px}
.menu button:hover,.menu button:focus-visible{background:var(--tint)}
.menu small{grid-column:1 / -1;color:var(--fg-dim)}
.menu .none{padding:8px;color:var(--fg-dim)}

.view{overflow:auto;padding:18px 22px 24px;min-height:0;flex:1}
/* a program's own GUI: its frame lives outside the redrawn view, so a redraw never reloads it */
.stage{display:flex;flex-direction:column;min-height:0}
.view.strip{flex:0 0 auto;padding-bottom:10px}
.guihost{flex:1;min-height:0;border-top:1px solid var(--border)}
.guihost iframe{display:block;width:100%;height:100%;border:0;background:var(--bg)}
.guihead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.guihead h1{margin:0;font-size:var(--fs-2)}
.guihead .kit{font-size:var(--fs--1);color:var(--fg-dim);border:1px solid var(--border);border-radius:999px;padding:1px 10px}
.head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font:600 var(--fs-2)/1.2 var(--disp);letter-spacing:var(--tight-disp);margin:0}
.state{display:inline-flex;align-items:center;gap:6px;color:var(--fg-dim)}
.state i{width:9px;height:9px;border-radius:50%;background:var(--h-sage)}

/* figures and summaries */
.figs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}
.fig{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.fig .n{font:600 var(--fs-2)/1.1 var(--sans);font-variant-numeric:tabular-nums}
.fig .l{color:var(--fg-dim);font-size:var(--fs--1)}
.fig.warn .n{color:var(--h-amber)} .fig.bad .n{color:var(--h-rust)} .fig.good .n{color:var(--h-sage)} .fig.run .n{color:var(--h-teal)}

.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius)}
.panel>header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border)}
.panel>header h2{font-size:var(--fs-1);margin:0;font-weight:600}
.panel>header .sp{flex:1}
.iconbtn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--fg-dim)}
.iconbtn:hover{background:var(--tint);color:var(--fg)}
.iconbtn svg{width:16px;height:16px}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border)}
.search{display:flex;align-items:center;gap:6px;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;padding:5px 8px;min-width:220px;flex:1}
.search input{all:unset;flex:1;color:var(--fg)}
.search input::placeholder{color:var(--fg-faint)}
.search kbd,.kbd{font:var(--fs--2) var(--mono);color:var(--fg-dim);border:1px solid var(--border);border-radius:4px;padding:0 5px}
.chip{border:1px solid var(--border);border-radius:999px;padding:3px 10px;color:var(--fg-dim);font-size:var(--fs--1);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{color:var(--fg);border-color:var(--chipc,var(--border-2));background:color-mix(in srgb,var(--chipc,var(--fg)) 12%,transparent)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--chipc,var(--fg-dim))}
select.sel{background:var(--bg-2);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:4px 8px;font:inherit;font-size:var(--fs--1)}

/* the board: a section per agent, newest card on top */
.board{padding:6px 14px 14px}
.sect{margin-top:12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-2)}
.sect>header{display:flex;align-items:center;gap:8px;padding:8px 10px}
.sect>header .name{font-weight:600}
.sect>header .proj{color:var(--fg-dim);font-size:var(--fs--1)}
.sect>header .sp{flex:1}
.sect>header .worst{width:9px;height:9px;border-radius:50%;background:var(--sev)}
.cards{display:grid;gap:8px;padding:0 10px 10px}
.card{position:relative;background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--sev,var(--border));border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--border-2);border-left-color:var(--sev,var(--border-2))}
.card.closed{opacity:1}
.card.closed .t{color:var(--fg-dim)}
.card.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{background:color-mix(in srgb,var(--sev,var(--h-steel)) 22%,var(--panel))}100%{background:var(--panel)}}
.card .top{display:flex;align-items:center;gap:8px}
.card .t{font-weight:600;flex:1;min-width:0}
.status{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs--1);color:var(--tone,var(--fg-dim))}
.status svg{width:14px;height:14px}
.status.spin svg{animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sev{font-size:var(--fs--2);text-transform:uppercase;letter-spacing:.06em;color:var(--sev)}
.card p{margin:6px 0 0;color:var(--fg-dim)}
.meter{height:6px;border-radius:3px;background:var(--tint);overflow:hidden;flex:1}
.meter i{display:block;height:100%;background:var(--h-teal);border-radius:3px;transition:width .5s}
.meter.indet i{width:30%;animation:indet 1.4s ease-in-out infinite}
@keyframes indet{0%{margin-left:-30%}100%{margin-left:100%}}
.pct{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:var(--fs--1);color:var(--fg-dim);font-variant-numeric:tabular-nums}
.facts{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:8px 0 0;font-size:var(--fs--1)}
.facts dt{color:var(--fg-dim)} .facts dd{margin:0}
.foot{display:flex;gap:12px;margin-top:8px;font-size:var(--fs--2);color:var(--fg-dim)}
.foot .sp{flex:1}
.acts{display:flex;gap:6px;margin-top:8px}
.act{border:1px solid var(--border-2);border-radius:7px;padding:3px 10px;font-size:var(--fs--1)}
.act:hover{background:var(--tint)}
.more{padding:4px 10px 10px;color:var(--fg-dim);font-size:var(--fs--1)}
.more button{text-decoration:underline}
.empty{padding:30px 14px;text-align:center;color:var(--fg-dim)}

/* minimised board: one bar, coloured by the worst unseen severity */
.minbar{display:flex;align-items:center;gap:10px;padding:10px 14px;width:100%;text-align:left}
.minbar .badge{padding:2px 8px;border-radius:999px;font-weight:600;color:var(--on-hue);background:var(--sev)}

/* the estate list */
.estate{list-style:none;margin:0;padding:6px}
.estate li{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;padding:8px;border-radius:8px}
.estate li+li{border-top:1px solid var(--border)}
.estate .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--tint);font:600 var(--fs--2) var(--mono);color:var(--fg)}
.estate .st{font-size:var(--fs--1)}
.estate .note{grid-column:2 / -1;font-size:var(--fs--1);color:var(--fg-dim)}

/* summaries: per-agent bars */
.bars{padding:10px 14px;display:grid;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:var(--fs--1)}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--tint)}
.stack i{display:block;height:100%}

/* a specific tab */
.ptab .reason{background:color-mix(in srgb,var(--h-steel) 10%,var(--panel));border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px}
.ptab .frozen{color:var(--h-amber)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}

/* drawers */
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:92vw;z-index:30;background:var(--panel);border-left:1px solid var(--border-2);box-shadow:-12px 0 40px rgb(0 0 0 / .3);display:flex;flex-direction:column}
.drawer>header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
.drawer>header h3{margin:0;font-size:var(--fs-1);flex:1}
.drawer .body{overflow:auto;padding:14px 16px;flex:1}
.vers{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.vers button{border:1px solid var(--border);border-radius:6px;padding:2px 8px;font:var(--fs--1) var(--mono);color:var(--fg-dim)}
.vers button[aria-current="true"]{color:var(--fg);border-color:var(--h-steel);background:color-mix(in srgb,var(--h-steel) 14%,transparent)}
.changed{background:color-mix(in srgb,var(--h-amber) 16%,transparent);border-radius:4px;padding:0 3px}
.wire{border-top:1px solid var(--border);background:var(--bg-2);max-height:34vh;display:flex;flex-direction:column}
.wire>header{display:flex;align-items:center;gap:10px;padding:6px 14px;border-bottom:1px solid var(--border);font-size:var(--fs--1)}
.wire>header b{font-weight:600}
.wire ol{list-style:none;margin:0;padding:6px 14px;overflow:auto;font:var(--fs--1)/1.6 var(--mono)}
.wire li{display:grid;grid-template-columns:70px 110px 1fr;gap:10px}
.wire .k-put{color:var(--h-steel)} .wire .k-store{color:var(--h-sage)} .wire .k-bus{color:var(--h-teal)} .wire .k-acted{color:var(--h-amber)} .wire .k-tab{color:var(--h-indigo)} .wire .k-refused{color:var(--h-rust)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:40;background:var(--panel);border:1px solid var(--border-2);border-radius:10px;padding:10px 16px;box-shadow:0 8px 30px rgb(0 0 0 / .35)}
.q{counter-reset:q;padding:0;margin:0;list-style:none;display:grid;gap:14px}
.q li{counter-increment:q;padding-left:30px;position:relative}
.q li::before{content:counter(q);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--h-amber);color:var(--on-hue);font-weight:600;font-size:var(--fs--1)}
.q b{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--fs--1);color:var(--fg-dim)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
/* Main: everything about rig and its programs, notifications on the right */
.maingrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start;height:100%;grid-template-rows:minmax(0,1fr)}
.rigstrip{display:flex;flex-wrap:wrap;gap:6px 22px;margin:-6px 0 14px;font-size:var(--fs--1)}
.rigstrip b{font-weight:600}
.progs{width:100%;border-collapse:collapse;font-size:var(--fs--1)}
.progs th{text-align:left;font-weight:600;color:var(--fg-dim);padding:8px 12px;border-bottom:1px solid var(--border)}
.progs td{padding:6px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.progs tr.row:hover td,.progs tr.open td{background:var(--glow)}
.progs .num{text-align:right;font-variant-numeric:tabular-nums}
.progs td.bad{color:var(--h-rust)}
.pname{display:inline-flex;align-items:center;gap:10px;font-weight:600;padding:2px 0}
.pname .ic,.estate .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--tint);font:600 var(--fs--2) var(--mono);color:var(--fg)}
.pst{display:inline-flex;align-items:center;gap:6px;color:var(--c)}
.pst i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.stale{margin-left:8px;border:1px solid var(--h-amber);color:var(--h-amber);border-radius:999px;padding:0 7px;font-size:var(--fs--2)}
.insp td{background:var(--bg-2)}
.inspect{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;padding:8px 4px 12px}
.inspect h3{margin:4px 0 8px;font-size:var(--fs-0)}
.hint{color:var(--h-amber);margin:10px 0 0}
.cmds{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.cmds li{display:grid;gap:0}
.notepanel{position:sticky;top:0;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;max-height:100%}
.notepanel>header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border)}
.notepanel>header h2{margin:0;font-size:var(--fs-1)}
.notepanel .sp{flex:1}
.notepanel .badge{padding:1px 8px;border-radius:999px;font-weight:600;font-size:var(--fs--1);color:var(--on-hue);background:var(--sev)}
.linkish{text-decoration:underline;color:var(--fg-dim);font-size:var(--fs--1)}
.nfilter{display:grid;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border)}
.nfilter .search{min-width:0}
.notes{list-style:none;margin:0;padding:4px 0;overflow:auto;flex:1}
.notes li{display:grid;grid-template-columns:10px 1fr;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);font-size:var(--fs--1)}
.notes li.none{display:block;color:var(--fg-dim);border:0}
/* read: a ring; unread: filled. Both full colour, since a faded mark fails 3:1 */
.notes .bullet{width:10px;height:10px;margin-top:5px;border-radius:50%;border:2px solid var(--sev)}
.notes li.unread .bullet{background:var(--sev)}
.notes li.unread b{color:var(--fg)}
.notes .nt{display:flex;gap:8px;justify-content:space-between}
.notes .src{font-size:var(--fs--2);color:var(--fg-dim);text-decoration:underline;margin-top:2px}
.notepanel footer{padding:10px 14px;border-top:1px solid var(--border);display:grid;gap:4px;font-size:var(--fs--1)}
/* a rig toast asked on a program's behalf */
.asktoast{position:fixed;right:20px;bottom:20px;z-index:40;width:360px;max-width:92vw;background:var(--panel);border:1px solid var(--border-2);border-left:4px solid var(--h-amber);border-radius:var(--radius);padding:12px 14px;display:grid;gap:6px;box-shadow:0 12px 40px rgb(0 0 0 / .35)}
.asktoast .from{font-size:var(--fs--1);color:var(--fg-dim)}
.asktoast .acts{display:flex;gap:8px;margin-top:4px}
.asktoast .act.primary{background:var(--h-amber);color:var(--on-hue);border-color:var(--h-amber)}
/* requirement 16: Main's inner tabs */
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px}
.subtabs button{display:flex;align-items:center;gap:8px;padding:8px 14px;color:var(--fg-dim);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:600}
.subtabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--h-steel)}
.subtabs .cnt{font:500 var(--fs--1) var(--mono);color:var(--fg-dim)}
.subtabs .warn{font-size:var(--fs--1);color:var(--h-amber)}
button.fig{text-align:left;font:inherit;color:inherit;cursor:pointer}
button.fig:hover{border-color:var(--fg-faint)}
/* the rail's registered GUIs, each its colour (section 11, requirement 17) */
.railguis{display:flex;flex-direction:column;gap:6px;padding-top:6px;margin-top:2px;border-top:1px solid var(--border)}
.rail .railgui{font:600 var(--fs--1) var(--mono);color:var(--fg);box-shadow:inset 3px 0 0 var(--c)}
.pname .ic{box-shadow:inset 0 -2px 0 var(--c,transparent)}
.gtag{font:600 var(--fs--2) var(--sans);letter-spacing:.06em;color:var(--fg-dim);border:1px solid var(--border);border-radius:5px;padding:0 5px}
.ptab .subh{font-size:var(--fs-1);margin:18px 0 10px}
/* the GUI frame takes the keyboard, so it shows it has it */
.guihost{padding:2px}
.guihost:focus-within{background:var(--h-steel)}
/* requirement 17: everything clickable shows a hand, never a text cursor */
button,select,[role="tab"],[role="button"],.tab,.tab *{cursor:pointer}
button:disabled{cursor:default}
/* requirement 22: side and bottom panels slide, both ways */
.drawer{transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s linear 0s}
.drawer[hidden]{display:flex !important;transform:translateX(104%);visibility:hidden;transition:transform .2s ease-in,visibility 0s linear .2s}
.wire{transition:max-height .26s cubic-bezier(.2,.8,.2,1),visibility 0s linear 0s;overflow:hidden}
.wire[hidden]{display:flex !important;max-height:0;visibility:hidden;border-top-color:transparent;transition:max-height .2s ease-in,visibility 0s linear .2s}
.wscope{display:flex;align-items:center;gap:8px}
.wsearch input{width:200px}
/* requirements 23 to 26: what needs him */
.subtabs button.hot .cnt{background:var(--h-amber);color:var(--on-hue);border-radius:9px;padding:0 7px}
.needs{display:grid;gap:0}
.need{display:grid;gap:6px;padding:12px 14px;border-bottom:1px solid var(--border);box-shadow:inset 3px 0 0 var(--sev)}
.need:last-child{border-bottom:0}
.need .who{display:flex;gap:10px;align-items:baseline;font-size:var(--fs--1)}
.need .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.act.primary{background:var(--h-amber);color:var(--on-hue);border-color:var(--h-amber)}
.card.asks{box-shadow:inset 0 0 0 1px var(--h-amber)}
.chosen{color:var(--h-sage);font-size:var(--fs--1)}
.act.chosen-act{border-color:var(--h-sage);color:var(--h-sage)}
.act:disabled{opacity:1;color:var(--fg-dim)}
.notes li.asks{background:color-mix(in srgb,var(--h-amber) 8%,transparent)}
.nopen{display:grid;gap:2px;text-align:left;width:100%;padding:0;color:inherit;font:inherit}
.nopen .nt{display:flex;gap:8px;justify-content:space-between}
.nmeta{display:flex;gap:10px;align-items:center;margin-top:4px}
.decide{font-size:var(--fs--1);color:var(--h-amber);font-weight:600}
.sevdot{width:10px;height:10px;border-radius:50%;background:var(--sev)}
.tray{gap:8px}
.trayic{position:relative;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--tint);font:700 var(--fs--1) var(--mono);color:var(--fg)}

.srctabs{display:flex;gap:4px;flex-wrap:wrap;padding:8px 14px 0}
.srctabs button{display:flex;gap:6px;align-items:center;padding:4px 10px;border-radius:999px;border:1px solid var(--border);color:var(--fg-dim);font-size:var(--fs--1)}

.inp[aria-invalid="true"]{border-color:var(--h-rust)}

.sets td{vertical-align:top}

.capgrid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}

.caplist h5{margin:8px 0 2px;font-size:var(--fs--1);color:var(--fg-dim);font-weight:600}

@keyframes fade{from{opacity:0}}

.pathctl{display:grid;gap:6px}
.pathctl .row{display:flex;gap:10px;align-items:center}

<script>
/* generated by design/dashboard/build.py from theme.js, rig-kit.js, mock.js - edit those */
(function(){
/* ═══════════════════════════════════════════════════════════════════════════
   rig - the theme engine.

   Every visual parameter is data, not CSS. A theme is a small object; this
   turns it into the token set the whole product is painted with. That is the
   point: the palette, the faces, the type scale, the density and the corner
   radius are all tweakable AFTER the thing is built, and in rig they arrive
   the same way any other setting does - declared as JSON Schema, layered,
   live-pushed (PLAN.md §6).

   Two rules the engine enforces so a tweak cannot quietly break legibility:

   1. THE HUES ARE GENERATED IN OKLCH, so "six evenly spaced at one lightness
      and one chroma" is arithmetic rather than a promise. Move the lightness
      and all six move together and stay a family.
   2. THE NEUTRALS ARE SOLVED, NOT CHOSEN. --border, --fg-dim and --fg-faint
      are binary-searched to the lightest (dark) or darkest (light) value that
      still clears its WCAG target on EVERY surface it can land on. That is
      how the inherited #556579 border - 2.40:1 on --panel - stops being
      possible to type in.
   ═══════════════════════════════════════════════════════════════════════ */

/* ── colour maths: oklch <-> sRGB, and WCAG 2.x contrast ────────────────── */
const clamp01 = x => Math.min(1, Math.max(0, x));
const f2s = c => c <= 0.0031308 ? 12.92*c : 1.055*Math.pow(c, 1/2.4) - 0.055;
const s2f = c => c <= 0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);

function oklchToRgb(L, C, hDeg){
  const h = hDeg*Math.PI/180;
  const a = C*Math.cos(h), b = C*Math.sin(h);
  const l_ = L + 0.3963377774*a + 0.2158037573*b;
  const m_ = L - 0.1055613458*a - 0.0638541728*b;
  const s_ = L - 0.0894841775*a - 1.2914855480*b;
  const l = l_**3, m = m_**3, s = s_**3;
  return [
    +4.0767416621*l - 3.3077115913*m + 0.2309699292*s,
    -1.2684380046*l + 2.6097574011*m - 0.3413193965*s,
    -0.0041960863*l - 0.7034186147*m + 1.7076147010*s,
  ];
}
function rgbToOklch(r, g, b){            // r,g,b linear 0-1
  const l = Math.cbrt(0.4122214708*r + 0.5363325363*g + 0.0514459929*b);
  const m = Math.cbrt(0.2119034982*r + 0.6806995451*g + 0.1073969566*b);
  const s = Math.cbrt(0.0883024619*r + 0.2817188376*g + 0.6299787005*b);
  const L = 0.2104542553*l + 0.7936177850*m - 0.0040720468*s;
  const A = 1.9779984951*l - 2.4285922050*m + 0.4505937099*s;
  const B = 0.0259040371*l + 0.7827717662*m - 0.8086757660*s;
  let h = Math.atan2(B, A)*180/Math.PI; if (h < 0) h += 360;
  return {L, C: Math.hypot(A, B), h};
}
const inGamut = ([r,g,b]) => [r,g,b].every(v => v >= -1e-4 && v <= 1+1e-4);

/** oklch to a hex string, reducing chroma until the colour is representable. */
function okhex(L, C, h){
  let c = C;
  for (let i = 0; i < 48 && !inGamut(oklchToRgb(L, c, h)); i++) c *= 0.94;
  const [r,g,b] = oklchToRgb(L, c, h).map(v => Math.round(clamp01(f2s(v))*255));
  return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
}
function hexToOklch(hex){
  const n = hex.replace('#','');
  const [r,g,b] = [0,2,4].map(i => s2f(parseInt(n.substr(i,2),16)/255));
  return rgbToOklch(r,g,b);
}
const lumOf = hex => {
  const n = hex.replace('#','');
  const [r,g,b] = [0,2,4].map(i => s2f(parseInt(n.substr(i,2),16)/255));
  return 0.2126*r + 0.7152*g + 0.0722*b;
};
const contrast = (a, b) => {
  const A = lumOf(a), B = lumOf(b);
  return (Math.max(A,B)+0.05)/(Math.min(A,B)+0.05);
};

/* ── perceptual separation: CIEDE2000 ───────────────────────────────────
   Contrast answers "can this be read". It says nothing about whether two
   colours shown side by side can be TOLD APART, which is a different
   question with its own measurement. CIEDE2000 is that measurement: the
   CIE's perceptual colour difference, where ~1 is the just-noticeable
   difference, ~5 is "clearly different at a glance" and ~10+ is
   unmistakable across a room. A categorical palette is judged by its
   WORST pair, never its average.                                        */
function hexToLab(hex){
  const n = hex.replace('#','');
  let [r,g,b] = [0,2,4].map(i => s2f(parseInt(n.substr(i,2),16)/255));
  // sRGB D65 -> XYZ, then XYZ -> CIELAB against the D65 white point
  const X = (0.4124564*r + 0.3575761*g + 0.1804375*b) / 0.95047;
  const Y = (0.2126729*r + 0.7151522*g + 0.0721750*b) / 1.00000;
  const Z = (0.0193339*r + 0.1191920*g + 0.9503041*b) / 1.08883;
  const f = t => t > 216/24389 ? Math.cbrt(t) : (841/108)*t + 4/29;
  const [fx,fy,fz] = [f(X),f(Y),f(Z)];
  return [116*fy - 16, 500*(fx-fy), 200*(fy-fz)];
}
function deltaE2000(hexA, hexB){
  const [L1,a1,b1] = hexToLab(hexA), [L2,a2,b2] = hexToLab(hexB);
  const rad = Math.PI/180, deg = 180/Math.PI;
  const C1 = Math.hypot(a1,b1), C2 = Math.hypot(a2,b2), Cb = (C1+C2)/2;
  const G  = 0.5*(1 - Math.sqrt(Math.pow(Cb,7)/(Math.pow(Cb,7)+Math.pow(25,7))));
  const A1 = (1+G)*a1, A2 = (1+G)*a2;
  const Cp1 = Math.hypot(A1,b1), Cp2 = Math.hypot(A2,b2);
  const hp = (b,a) => { if (b===0 && a===0) return 0;
    const h = Math.atan2(b,a)*deg; return h < 0 ? h+360 : h; };
  const hp1 = hp(b1,A1), hp2 = hp(b2,A2);
  const dLp = L2-L1, dCp = Cp2-Cp1;
  let dhp = 0;
  if (Cp1*Cp2 !== 0){
    dhp = hp2-hp1;
    if (dhp >  180) dhp -= 360;
    if (dhp < -180) dhp += 360;
  }
  const dHp = 2*Math.sqrt(Cp1*Cp2)*Math.sin(dhp/2*rad);
  const Lbp = (L1+L2)/2, Cbp = (Cp1+Cp2)/2;
  let hbp;
  if (Cp1*Cp2 === 0) hbp = hp1+hp2;
  else if (Math.abs(hp1-hp2) <= 180) hbp = (hp1+hp2)/2;
  else hbp = (hp1+hp2 < 360) ? (hp1+hp2+360)/2 : (hp1+hp2-360)/2;
  const T = 1 - 0.17*Math.cos((hbp-30)*rad) + 0.24*Math.cos(2*hbp*rad)
              + 0.32*Math.cos((3*hbp+6)*rad) - 0.20*Math.cos((4*hbp-63)*rad);
  const dTh = 30*Math.exp(-Math.pow((hbp-275)/25, 2));
  const Rc  = 2*Math.sqrt(Math.pow(Cbp,7)/(Math.pow(Cbp,7)+Math.pow(25,7)));
  const Sl  = 1 + (0.015*Math.pow(Lbp-50,2))/Math.sqrt(20+Math.pow(Lbp-50,2));
  const Sc  = 1 + 0.045*Cbp, Sh = 1 + 0.015*Cbp*T;
  const Rt  = -Math.sin(2*dTh*rad)*Rc;
  return Math.sqrt(Math.pow(dLp/Sl,2) + Math.pow(dCp/Sc,2) + Math.pow(dHp/Sh,2)
                 + Rt*(dCp/Sc)*(dHp/Sh));
}
/** The worst pair in a set. A palette is only as separable as this number. */
function separation(hexes){
  let worst = Infinity, pair = null;
  for (let i=0;i<hexes.length;i++) for (let j=i+1;j<hexes.length;j++){
    const d = deltaE2000(hexes[i], hexes[j]);
    if (d < worst){ worst = d; pair = [i,j]; }
  }
  return {worst, pair};
}

/* ── the solver: the lightest/darkest neutral that clears a target ──────── */

/* solveNeutralChecked -> {hex, ok}
 *
 * `ok` exists because the search ALWAYS returns a colour. Thirty iterations
 * narrow the bracket whether or not any L clears the target, so on a ladder
 * where nothing can pass, the old signature handed back a failing neutral and
 * said nothing - and section 6's promise is that "rig refuses to apply a token
 * set that fails, naming the token and the ground", which needs a signal to
 * refuse on. checkTheme re-measures every token anyway, so this is belt and
 * braces; what it adds is the DISTINCTION between "this value fails" and "no
 * value exists", which are different messages to put in front of a person.
 */
function solveNeutralChecked(target, grounds, {hue, chroma, dark}){
  // binary search on oklch L. Dark themes want the DIMMEST passing value, so
  // nothing is brighter than it has to be (halation is a real cost, see the
  // readable-output notes); light themes want the LIGHTEST passing value.
  let lo = 0, hi = 1;
  const passes = L => {
    const hex = okhex(L, chroma, hue);
    return grounds.every(g => contrast(hex, g) >= target);
  };
  // Probe both ends first: if neither extreme passes, no interior value will
  // either, and the bracket the loop below reports would be meaningless.
  const anyEnd = passes(0) || passes(1);
  for (let i = 0; i < 30; i++){
    const mid = (lo+hi)/2;
    if (passes(mid)) { if (dark) hi = mid; else lo = mid; }
    else             { if (dark) lo = mid; else hi = mid; }
  }
  const hex = okhex(dark ? hi : lo, chroma, hue);
  return {hex, ok: anyEnd && grounds.every(g => contrast(hex, g) >= target)};
}

function solveNeutral(target, grounds, opts){
  return solveNeutralChecked(target, grounds, opts).hex;
}

/* ── the default theme. Every number here is a knob. ────────────────────── */
const DEFAULTS = {
  faces: {
    display: 'Fraunces',
    ui:      'Inter Tight',
    mono:    'JetBrains Mono',
  },
  type: { base: 16, scale: 1.26, uiTight: -0.011, dispTight: -0.024, lineHeight: 1.55 },
  shape:{ radius: 12, density: 1, gut: 1.6 },
  /* THE FAMILY, and it carries meaning as well as identity.
     Red is bad and green is good everywhere a person has ever used a
     computer, so those two angles are ANCHORED and the optimiser is not
     allowed to move them. `role` says what a member means; `identity: false`
     means no program may ever own it, because a shell that turns red when
     you open a program is telling you something untrue.

     The free angles are placed to maximise the WORST pairwise CIEDE2000 in
     the set, which is the measurement for "can these be told apart", and is
     a different question from contrast. */
  hues: {
    members: [
      {name:'rust',  angle: 27, role:'bad',      identity:false, anchored:true },
      {name:'amber', angle: 78, role:'warn',     identity:false, anchored:true },
      {name:'sage',  angle:148, role:'good',     identity:true,  anchored:true },
      {name:'teal',  angle:196, role:'progress', identity:true,  anchored:false},
      {name:'steel', angle:252, role:'info',     identity:true,  anchored:true },
      {name:'indigo',angle:294, role:'-',        identity:true,  anchored:false},
      {name:'lilac', angle:345, role:'-',        identity:true,  anchored:false},
    ],
    rotate: 0,
    dark:  { L: 0.800, C: 0.098 },
    light: { L: 0.470, C: 0.110 },
  },
  surfaces: {
    hue: 252, chroma: 0.022,
    // every surface is its own knob, because "one step" cannot express a
    // light theme, where the panel goes UP toward white and the recessed
    // grounds go DOWN away from it
    dark:  { bg:0.215, bg2:0.248, panel:0.280, glow:0.292, tint:0.330, fg:0.918 },
    light: { bg:0.968, bg2:0.995, panel:1.000, glow:0.936, tint:0.922, fg:0.200 },
  },
  motion: true,
};

/* ── build a full token set from a theme object ─────────────────────────── */
function tokens(theme, mode){
  const dark = mode === 'dark';
  const s  = theme.surfaces, sm = dark ? s.dark : s.light;
  const H  = dark ? theme.hues.dark : theme.hues.light;
  const N  = (L) => okhex(Math.min(1, Math.max(0, L)), s.chroma, s.hue);

  const bg    = N(sm.bg);
  const bg2   = N(sm.bg2);
  const panel = N(sm.panel);
  const glow  = N(sm.glow);
  const tint  = N(sm.tint);
  // Two ground sets, because --tint is a surface text lands on and a boundary
  // never does. It is the extreme of the ladder in both themes, so a token
  // solved against the other four and then used on it is a token solved
  // against the wrong question - which is exactly how a 3.95:1 shipped.
  const grounds     = [bg, bg2, panel, glow];
  const textGrounds = [bg, bg2, panel, glow, tint];

  // solved, not chosen. fg-dim is held one step stronger than fg-faint so the
  // hierarchy survives a tweak instead of collapsing into one colour.
  const fg      = N(sm.fg);
  const fgDim   = solveNeutral(5.6, textGrounds, {hue:s.hue, chroma:s.chroma*1.5, dark});
  const fgFaint = solveNeutral(4.5, textGrounds, {hue:s.hue, chroma:s.chroma*1.5, dark});
  const border  = solveNeutral(3.0, grounds,     {hue:s.hue, chroma:s.chroma*1.8, dark});
  const border2 = solveNeutral(4.5, grounds,     {hue:s.hue, chroma:s.chroma*1.8, dark});

  const hue = {};
  theme.hues.members.forEach(m => {
    const a = (m.angle + theme.hues.rotate + 360) % 360;
    hue[m.name] = okhex(H.L, H.C, a);
    hue['o-'+m.name] = `oklch(${(H.L*100).toFixed(1)}% ${H.C.toFixed(3)} ${a.toFixed(0)})`;
  });

  const t = theme.type, sc = t.scale;
  return {
    '--bg':bg, '--bg-2':bg2, '--panel':panel, '--glow':glow, '--tint':tint,
    '--fg':fg, '--fg-dim':fgDim, '--fg-faint':fgFaint,
    '--border':border, '--border-2':border2,
    '--on-hue': dark ? '#0d1117' : '#ffffff',
    ...Object.fromEntries(theme.hues.members.flatMap(m => [
      [`--h-${m.name}`, hue[m.name]], [`--o-${m.name}`, hue['o-'+m.name]],
    ])),
    // semantic aliases, so a surface asks for meaning and never for a colour
    ...Object.fromEntries(theme.hues.members.filter(m => m.role !== '-').map(m =>
      [`--sem-${m.role}`, hue[m.name]])),
    '--disp': `"${theme.faces.display}", ui-serif, Georgia, serif`,
    '--sans': `"${theme.faces.ui}", Cantarell, ui-sans-serif, system-ui, sans-serif`,
    '--mono': `"${theme.faces.mono}", ui-monospace, monospace`,
    '--fs-0': `max(12px, ${(t.base/16).toFixed(3)}rem)`,
    '--fs--1':`max(12px, ${(t.base/16/sc).toFixed(3)}rem)`,
    '--fs--2':`max(12px, ${(t.base/16/sc/sc).toFixed(3)}rem)`,
    '--fs-1': `${(t.base/16*sc).toFixed(3)}rem`,
    '--fs-2': `${(t.base/16*sc*sc).toFixed(3)}rem`,
    '--fs-3': `${(t.base/16*sc*sc*sc).toFixed(3)}rem`,
    '--fs-hero': `clamp(2.5rem, 6.2vw, ${(t.base/16*Math.pow(sc,5)).toFixed(2)}rem)`,
    '--lh': String(t.lineHeight),
    '--tight-ui': `${t.uiTight}em`,
    '--tight-disp': `${t.dispTight}em`,
    '--radius': `${theme.shape.radius}px`,
    '--den': String(theme.shape.density),
    '--gut': `${theme.shape.gut}rem`,
    '--motion': theme.motion ? '1' : '0',
  };
}

/* ── the gate: refuse a token set a person could not read ────────────────
 *
 * Section 6: "rig refuses to apply a token set that fails, naming the token
 * and the ground, so a theme cannot silently produce an unreadable product."
 * This is that refusal, and it lives in the engine rather than in the window
 * so that the window, the design page and CI all judge a theme the same way.
 *
 * TWO GROUND SETS, because they answer different questions. Text lands on all
 * five surfaces including `tint`; a boundary never lands on `tint`. Solving or
 * checking a text token against the boundary four is how a 3.95:1 reaches a
 * page that audits clean - section 6 rule 2, and the reason the split is
 * duplicated here rather than shared with tokens(): each is meant to be
 * readable on its own.
 *
 * WHAT IS CHECKED, and why each one can actually fail:
 *
 *   --fg           4.5  on the 5 text grounds. CHOSEN from the ladder, not
 *                       solved, so it is the one a settings box can break
 *                       directly. Measured: dragging dark fg L from 0.918 to
 *                       0.40 takes it to 1.52-1.91:1 on every ground.
 *   --fg-dim       5.6  solved, but the solver returns a colour whether or not
 *   --fg-faint     4.5  one passes, so the result is re-measured here.
 *   --border       3.0  on the 4 boundary grounds (WCAG 1.4.11).
 *   --border-2     4.5
 *   --h-*          4.5  on the 5 text grounds. A hue is TEXT wherever
 *                       --sem-<role> or --hue is used as a colour, and the
 *                       hues come from an L/C pair a person can set: dropping
 *                       dark L from 0.800 to 0.35 puts all seven at 1.03-1.13
 *                       on --tint.
 *   --on-hue       4.5  against each hue, since that is text ON a hue ground.
 *
 * WHAT IS DELIBERATELY NOT CHECKED. Composited surfaces - a
 * `color-mix(in srgb, var(--hue) 13%, transparent)` callout, for instance -
 * are not tokens and cannot be resolved without a layout engine. The browser
 * contrast gate measures those on the real page, which is the right division:
 * this gate judges the token set, that one judges what gets painted. Neither
 * subsumes the other and a theme needs both.
 *
 * Rejection names the token AND the ground (section 6 rule 3): "contrast too
 * low" without the ground is not actionable, because the fix differs depending
 * on which surface it failed against.
 */
function checkTheme(theme, mode){
  const k = tokens(theme, mode);
  const g = n => [n, k['--' + n]];
  const textGrounds  = ['bg', 'bg-2', 'panel', 'glow', 'tint'].map(g);
  const boundGrounds = ['bg', 'bg-2', 'panel', 'glow'].map(g);

  const findings = [];
  const check = (token, need, grounds, kind) => {
    const fg = k[token];
    if (!fg) return;
    for (const [name, hex] of grounds){
      const ratio = contrast(fg, hex);
      if (ratio < need - 0.005){
        findings.push({token, ground: '--' + name, ratio: Math.round(ratio*100)/100,
                       need, kind, colour: fg});
      }
    }
  };

  check('--fg',       4.5, textGrounds,  'text');
  check('--fg-dim',   5.6, textGrounds,  'text');
  check('--fg-faint', 4.5, textGrounds,  'text');
  check('--border',   3.0, boundGrounds, 'boundary');
  check('--border-2', 4.5, boundGrounds, 'boundary');

  for (const m of theme.hues.members) check('--h-' + m.name, 4.5, textGrounds, 'text');

  // Text ON a hue, which is the mirror of the row above and fails separately:
  // --on-hue is a fixed near-black or white, so a hue L chosen in the middle
  // of the range can leave nothing readable on top of it.
  check('--on-hue', 4.5, theme.hues.members.map(m => [
    'h-' + m.name, k['--h-' + m.name]]), 'text');

  // Named separately from the ratio findings: "no value exists" and "this
  // value fails" call for different fixes - the first means the ladder itself
  // has no room, the second means this token is wrong.
  const s = theme.surfaces, sm = mode === 'dark' ? s.dark : s.light;
  const dark = mode === 'dark';
  const N = (L) => okhex(Math.min(1, Math.max(0, L)), s.chroma, s.hue);
  const tg = ['bg', 'bg2', 'panel', 'glow', 'tint'].map(n => N(sm[n]));
  const bg4 = ['bg', 'bg2', 'panel', 'glow'].map(n => N(sm[n]));
  const unsolvable = [];
  for (const [token, target, grounds, chromaMul] of [
    ['--fg-dim',   5.6, tg,  1.5], ['--fg-faint', 4.5, tg,  1.5],
    ['--border',   3.0, bg4, 1.8], ['--border-2', 4.5, bg4, 1.8],
  ]){
    const r = solveNeutralChecked(target, grounds,
                                  {hue: s.hue, chroma: s.chroma*chromaMul, dark});
    if (!r.ok) unsolvable.push({token, need: target});
  }

  return {ok: findings.length === 0 && unsolvable.length === 0, findings, unsolvable, mode};
}

/* One line per finding, for a terminal or a settings panel. */
function explainCheck(result){
  const out = [];
  for (const u of result.unsolvable){
    out.push(`${u.token}: no value clears ${u.need.toFixed(1)}:1 on every ground ` +
             `in this ladder - the surfaces are too close together`);
  }
  for (const f of result.findings){
    out.push(`${f.token} (${f.colour}) on ${f.ground}: ${f.ratio.toFixed(2)}:1, ` +
             `needs ${f.need.toFixed(1)} as ${f.kind}`);
  }
  return out;
}

function apply(theme, mode, root = document.documentElement){
  const t = tokens(theme, mode);
  for (const [k,v] of Object.entries(t)) root.style.setProperty(k, v);
  root.dataset.theme = mode;
  root.style.setProperty('color-scheme', mode);
  return t;
}

/** The same token set as a rig config fragment, so a tweak here is a paste. */
function toToml(theme, mode){
  const t = tokens(theme, mode);
  const lines = [`# rig.toml - [ui.theme.${mode}]`, `[ui.theme]`,
    `display_face = "${theme.faces.display}"`,
    `ui_face      = "${theme.faces.ui}"`,
    `mono_face    = "${theme.faces.mono}"`,
    `base_size    = ${theme.type.base}`,
    `type_scale   = ${theme.type.scale}`,
    `radius       = ${theme.shape.radius}`,
    `density      = ${theme.shape.density}`,
    `hue_rotate   = ${theme.hues.rotate}`,
    `motion       = ${theme.motion}`,
    ``, `[ui.theme.${mode}.tokens]   # generated, and every neutral is solved`];
  for (const [k,v] of Object.entries(t))
    if (k.startsWith('--') && v.startsWith('#')) lines.push(`${k.slice(2).replace(/-/g,'_')} = "${v}"`);
  return lines.join('\n');
}


/* ── place the free hues for maximum worst-pair separation ──────────────
   Anchored members (red = bad, green = good, blue = info, amber = warn) do
   not move: their meaning is worth more than a point of deltaE. Everything
   else is searched, coarse then fine, maximising the WORST pair - which is
   the only statistic that matters for a categorical set, because the palette
   fails at its closest pair and nowhere else.                            */
function optimiseHues(theme, mode){
  const H = mode === 'dark' ? theme.hues.dark : theme.hues.light;
  const ms = theme.hues.members;
  const hexes = () => ms.map(m => okhex(H.L, H.C, (m.angle+360)%360));
  const score = () => separation(hexes()).worst;
  const free = ms.map((m,i)=>[m,i]).filter(([m])=>!m.anchored);
  let best = score();
  for (const step of [12, 5, 2, 1]){
    let moved = true, guard = 0;
    while (moved && guard++ < 60){
      moved = false;
      for (const [m] of free){
        for (const d of [step, -step]){
          const was = m.angle;
          m.angle = (m.angle + d + 360) % 360;
          const now = score();
          if (now > best + 1e-6){ best = now; moved = true; }
          else m.angle = was;
        }
      }
    }
  }
  return best;
}

// What rig hands a program that registers a GUI (plan/55, requirements 10

// The bridge, as the GUI sees it (plan/55 requirement 13): the GUI acts on
// its program only through what rig already carries. Each call is a rig
// verb, answered by rig, and rig checks it before the program sees it.
//
//   rig.invoke(command, args)  a command the program declares
//   rig.store.get(key)         the program's own collection
//   rig.events.on(topic, fn)   a bus event the program publishes
//   rig.queue.push(job, args)  long work, with rig's progress
//   rig.toast({title, body, actions})  ask the user; resolves to the choice
//
// Outside rig (opened alone) every call rejects and the GUI shows whatever
// state it was seeded with.
const BRIDGE = `(function(){
  var seq = 0, waiting = {}, subs = {};
  var inRig = window.parent !== window;
  function call(verb, args) {
    return new Promise(function (ok, no) {
      if (!inRig) { no(new Error('not inside rig')); return; }
      var id = ++seq; waiting[id] = { ok: ok, no: no };
      window.parent.postMessage({ rig: 'call', id: id, verb: verb, args: args }, '*');
    });
  }
  window.rig = {
    invoke: function (command, args) { return call('invoke', { command: command, args: args || {} }); },
    store: { get: function (key) { return call('store.get', { key: key }); } },
    events: { on: function (topic, fn) { (subs[topic] = subs[topic] || []).push(fn); if (inRig) window.parent.postMessage({ rig: 'sub', topic: topic }, '*'); } },
    queue: { push: function (job, args) { return call('queue.push', { job: job, args: args || {} }); } },
    toast: function (t) { return call('toast', t); },
  };
  window.addEventListener('message', function (e) {
    var m = e.data;
    if (e.source !== window.parent || !m || typeof m.type !== 'string') return;
    if (m.type === 'theme') { document.documentElement.setAttribute('data-theme', m.data === 'light' ? 'light' : 'dark'); return; }
    if (m.type === 'reply' && waiting[m.id]) { var w = waiting[m.id]; delete waiting[m.id]; if (m.ok) w.ok(m.result); else w.no(new Error(m.error)); return; }
    if (m.type === 'event') (subs[m.topic] || []).forEach(function (fn) { fn(m.data); });
  });
})();`;

// One GUI document: rig's stylesheet and bridge, then the program's page.
function guiDoc(css, body, theme, seed) {
  const safe = (s) => s.replace(/<\/(script|style)/gi, '<\\/$1');
  return `<!doctype html><html lang="en" data-theme="${theme === 'light' ? 'light' : 'dark'}"><head><meta charset="utf-8">`
    + `<style>${safe(css)}</style><script>${safe(BRIDGE)}<\/script>`
    + (seed ? `<script>window.RIG_SEED=${JSON.stringify(seed).replace(/</g, '\\u003c')};<\/script>` : '')
    + `</head><body>${body}</body></html>`;
}
