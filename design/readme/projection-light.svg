  <text x="462" y="288" font-family='"JetBrains Mono", ui-monospace, monospace' font-size="12" fill="#0f1720">config</text>
  <text x="540" y="288" font-family='"Inter Tight", Cantarell, ui-sans-serif, system-ui, sans-serif' font-size="11" fill="#59687a">layers, schema, provenance, live push</text>
  <text x="118" y="313" font-family='"JetBrains Mono", ui-monospace, monospace' font-size="12" fill="#0f1720">store</text>
  <text x="196" y="313" font-family='"Inter Tight", Cantarell, ui-sans-serif, system-ui, sans-serif' font-size="11" fill="#59687a">location, migrations, backup, integrity</text>
  <text x="462" y="313" font-family='"JetBrains Mono", ui-monospace, monospace' font-size="12" fill="#0f1720">secrets</text>
  <text x="540" y="313" font-family='"Inter Tight", Cantarell, ui-sans-serif, system-ui, sans-serif' font-size="11" fill="#59687a">keyring, namespaced per program</text>
  <text x="118" y="338" font-family='"JetBrains Mono", ui-monospace, monospace' font-size="12" fill="#0f1720">observe</text>
  <text x="196" y="338" font-family='"Inter Tight", Cantarell, ui-sans-serif, system-ui, sans-serif' font-size="11" fill="#59687a">log, trace and metric, merged</text>
  <text x="462" y="338" font-family='"JetBrains Mono", ui-monospace, monospace' font-size="12" fill="#0f1720">control</text>
  <text x="540" y="338" font-family='"Inter Tight", Cantarell, ui-sans-serif, system-ui, sans-serif' font-size="11" fill="#59687a">start, stop, invoke, health</text>
  <text x="118" y="363" font-family='"JetBrains Mono", ui-monospace, monospace' font-size="12" fill="#0f1720">schedule</text>
  <text x="196" y="363" font-family='"Inter Tight", Cantarell, ui-sans-serif, system-ui, sans-serif' font-size="11" fill="#59687a">one scheduler for the whole estate</text>
  <text x="462" y="363" font-family='"JetBrains Mono", ui-monospace, monospace' font-size="12" fill="#0f1720">bus</text>
  <text x="540" y="363" font-family='"Inter Tight", Cantarell, ui-sans-serif, system-ui, sans-serif' font-size="11" fill="#59687a">events between programs, by grant</text>
  <text x="118" y="388" font-family='"JetBrains Mono", ui-monospace, monospace' font-size="12" fill="#0f1720">rules</text>
  <text x="196" y="388" font-family='"Inter Tight", Cantarell, ui-sans-serif, system-ui, sans-serif' font-size="11" fill="#59687a">who may run what, what must ask first</text>
  <text x="462" y="388" font-family='"JetBrains Mono", ui-monospace, monospace' font-size="12" fill="#0f1720">hosted</text>
  <text x="540" y="388" font-family='"Inter Tight", Cantarell, ui-sans-serif, system-ui, sans-serif' font-size="11" fill="#59687a">programs with no binary of their own</text>
