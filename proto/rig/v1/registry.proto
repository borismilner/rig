// The rig wire contract, major version 1: the registry and the estate.
//
// Part of proto package rig.v1 exactly as wire.proto is, so every message
// keeps its full name, its numbers and its bytes on the wire. It is a
// separate FILE only so its generated Go code is a separate package: a
// program links the handshake in wire.proto and none of this, and the
// window links this and none of verbs.proto. See wire.proto's header.

syntax = "proto3";

package rig.v1;

import "proto/rig/v1/wire.proto";

option go_package = "github.com/borismilner/rig/proto/rig/v1/registryv1;registryv1";

// Program is one program as one principal may see it (section 14).
//
// It is Declaration minus scope: what a reader is shown, not what was stored.
// Section 5k's rule that no surface may imply completeness is why coverage
// travels with it.
//
// THIS COMMENT USED TO SAY "minus preamble and scope", AND THAT WAS THE BUG.
// Section 9 requires the preamble to be "returned by describe on the program",
// and a program has been able to declare one since M1 - accepted at hello,
// validated, stored in the registry - with no message on any path able to
// carry it back. It was a dead field for as long as it existed. Scope stays
// out: it is how rig decides who may see this program, not something the
// program said about itself.
message Program {
  Identity identity = 1;
  Coverage coverage = 2;
  string coverage_note = 3;
  int32 semantics_gen = 4;
  repeated string services = 5;
  bool hosted = 6;
  repeated Command commands = 7;

  // Where this program serves its own pane, validated at registration. A
  // reader gets it because the window is a reader like any other.
  string pane_url = 8;

  // The kit elements this program declares (section 5h R3). A reader gets it
  // for the same reason it gets services: it is part of what the program said
  // about itself, not part of how anything draws it.
  repeated string elements = 9;

  // The one document an agent reads before touching this program (section 9).
  //
  // Carried at DEPTH_FULL only. It is prose, it can be long, and fifteen of
  // them in one list is the context cost section 9's whole tiering argument
  // exists to avoid - so it travels with describe and not with list.
  string preamble = 10;
}

// Depth is how much of the estate a read wants (section 9).
//
// Section 9's argument for four meta tools is a context budget: fifteen
// programs with twenty commands each is three hundred tools, and handing an
// agent all of it "destroys its context before it has done anything". So
// `list` "returns the estate at whatever depth is asked for".
//
// The line between the last two is one sentence: DEPTH_COMMANDS carries what
// an agent picks a command BY, DEPTH_FULL carries what it calls the command
// WITH. Scalars and the one-line summary are how you choose; schemas,
// examples, preconditions and prose are how you invoke.
enum Depth {
  DEPTH_UNSPECIFIED = 0;

  // The estate itself: who is registered and how much of rig each has
  // adopted. No commands, no preamble.
  DEPTH_PROGRAMS = 1;

  // Every command's scalar properties and its summary - enough to choose
  // one, and nothing that costs a schema.
  DEPTH_COMMANDS = 2;

  // Everything this principal may see, preamble and argument schemas
  // included.
  DEPTH_FULL = 3;
}

// ---- rig.programs, the read side of the registry ---------------------------

message ProgramsRequest {
  // How much to say about each program. Absent means DEPTH_FULL, and that is
  // a COMPATIBILITY rule rather than a default worth having: every caller
  // written before this field existed asked for everything, and proto3 gives
  // it the zero value whether it says so or not. The kernel refuses an
  // unspecified depth outright (section 21's enum rule); the boundary is
  // where the old wire's meaning is restored, so exactly one place has to
  // know that the two disagree.
  Depth depth = 1;
}

message ProgramsResponse {
  // Only what the calling principal may see. An unscoped, unprivileged client
  // gets nothing; a program gets itself; a client of the owner's gets all of
  // it, because introspect was decided when the connection was made.
  repeated Program programs = 1;
}

// ---- rig.estate, which estate did I just reach (PLAN.md section 37) -------
//
// Section 37 runs at most two named estates, production and development, and
// Boris's requirement is that "the peers (all agents) will know which rig
// instance is which and will know when to be talking to which and for what
// purposes". An agent could not know that: XDG_RUNTIME_DIR is INHERITED from
// whatever launched it, so the estate was something an agent is PLACED IN and
// never something it reads.
//
// A METHOD RATHER THAN A FIELD ON SOMETHING EXISTING, and the alternatives
// were ruled out on mechanism. Not HelloResponse: a terminal never says hello,
// and an agent connects as an ordinary unregistered client, so the callers who
// need this most are exactly the ones that never handshake. Not PingResponse:
// that is a probe with a nonce which answers FROM THE PROGRAM ADDRESSED, and
// estate identity is a fact about the daemon - hanging it off a per-program
// probe is the conflation section 21 keeps catching. Giving terminals a hello
// instead was rejected on section 14's own terms, because `scoped` is the whole
// authorisation state a connection carries and making it ambiguous breaks a
// load-bearing boolean.
//
// IT IS UNSCOPED, AND IT IS THE FIRST RIG METHOD WHOSE ANSWER DOES NOT DEPEND
// ON WHO IS ASKING. Section 14 makes any surface whose product is an
// estate-wide AGGREGATE a granted surface - the capability map, config export,
// doctor, the palette, the tray, the notification centre, the schedule. This
// aggregates nothing: every field below is a fact about the daemon itself and
// none is data belonging to another principal. Scoping restricts which
// PROGRAMS a caller sees, and the estate is not a program. Walked against
// section 14's six rows and every kind gets the full answer, a registered
// program included. A LATER FIELD COULD QUIETLY DESTROY THAT PROPERTY, so
// anything added here is walked again.

message EstateRequest {}

// EstateRole is what an estate is FOR.
//
// UNNAMED HAS A NUMBER OF ITS OWN AND THE ZERO IS NOT IT. proto3 cannot tell
// an unset scalar from a zero one, so a daemon that carries this field and
// fails to set it - a bug, or a build where the field landed and the setter
// did not - would render as "this is an unnamed estate" and an agent would
// branch on it. An unnamed estate reads as ephemeral and disposable and
// production does not, so the safe guess and the useful guess point opposite
// ways. Zero therefore keeps section 21's meaning, "nothing was said", and the
// identity fact gets a value of its own.
enum EstateRole {
  ESTATE_ROLE_UNSPECIFIED = 0;  // nothing was said. Never a fact about an estate
  ESTATE_ROLE_UNNAMED = 1;      // deliberately unnamed: a test, a build, an ephemeral run
  ESTATE_ROLE_PRODUCTION = 2;
  ESTATE_ROLE_DEVELOPMENT = 3;
}

message EstateResponse {
  // The name this estate claimed, empty when it claimed none. Section 37's
  // precondition 6 makes it unique across the machine while it is held.
  string name = 1;

  // ROLE IS DERIVED FROM name BY THE DAEMON, AT REPLY TIME, AND IS NEVER
  // STORED AND NEVER ACCEPTED AS INPUT. A client must never send one and must
  // never infer the other.
  //
  // Both are carried on purpose even though the name set is closed at two
  // today and role is therefore derivable. With only the name, the derivation
  // `name == "production"` would live in every consumer - every agent, every
  // script, outside this repository and uncountable - and reopening the set
  // would break all of them silently. Here it lives in the daemon, once, and
  // reopening the set breaks nothing. The two cannot disagree because there is
  // no second place to write one.
  EstateRole role = 2;

  // The daemon's own build. The same value `rig.ping` returns when it is
  // addressed to rig itself, consolidated here so one call answers "who did I
  // reach" rather than requiring a caller to know to probe "rig".
  string daemon_version = 3;

  // The wire contract's major. Carried for completeness rather than for skew
  // detection: the major rides the proto package path, so a client and a
  // daemon on different majors cannot connect at all and major skew is
  // structurally impossible rather than undetected.
  string wire = 4;

  // RIG'S OWN SEMANTIC GENERATION, FROM ITS SELF-DECLARATION, AND IT IS NOT A
  // PER-PROGRAM SKEW DETECTOR. Do not read this as "have the programs I use
  // changed meaning". That question is per-program, its answer is already on
  // the wire in Program.semantics_gen and already readable, and what it needs
  // is a consumer on the capability map. This field answers only "what
  // semantics does the daemon itself implement", which is what a client built
  // from the development tree needs when it reaches the production daemon.
  int32 semantics_gen = 5;

  // THE INCARNATION, AS OPPOSED TO THE IDENTITY. Every other field in this
  // message is identical across a restart - same name, same role, same build,
  // same wire, same generation - so an agent holding a handle from before
  // could not tell "same rig, still up" from "same rig, restarted under me",
  // and a lease it believes it holds may already be somebody else's. This is
  // the only field here that moves, and a caller that remembers the last one
  // it saw gets the distinction for free.
  //
  // Bumped unconditionally on every start, with nothing consulted (section
  // 37, precondition 4, and V15): the cost of treating a planned restart as a
  // crash is one re-acquisition, and the cost of the reverse is a fencing
  // token that outlives what it fences.
  //
  // ZERO MEANS NO PERSISTENT STATE, WHICH IS AN ANSWER RATHER THAN A HOLE. An
  // estate started without a name opens no store, because it has no name to
  // key a subtree to, so it has no epoch to report. A real epoch is always at
  // least 1, because the store bumps before it publishes, so 0 is
  // unambiguously "this estate has no persistent state" and cannot be
  // confused with a real one.
  uint64 epoch = 6;

  // WHERE THIS ESTATE KEEPS ITS STORAGE (plan/48, R14-R15): the root the
  // daemon resolved at start from --root, RIG_ROOT or ~/.rig, or the scratch
  // root of an unnamed estate. The estate's own areas are under it.
  //
  // Walked against section 14's caller rows as the estate arm requires: it is
  // a path in the same user's home, a fact about this daemon, and no other
  // principal's data. Empty from a daemon that predates the field.
  string root = 7;
}



// ============================================================================
// SECTION 12's TOASTS. They live in this file rather than verbs.proto so the
// tray, which links only this package, does not link every verb's messages
// to wait for a toast (measured: +364,448 bytes on rigwindow otherwise). Same
// proto package, so the full names and the bytes on the wire are unchanged.
// A program or a seat sends a notification; the daemon
// writes it into the record itself (kind "notification", the sender as its
// provenance), so nothing is ever only a toast, and a sender needs no
// record-write permission. The tray waits on rig.toast.wait and starts the
// renderer when the first one arrives.
// ============================================================================

// AgentBox's five, in rising order of how loudly they are drawn.
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_INFO = 1;
  SEVERITY_SUCCESS = 2;
  SEVERITY_WARNING = 3;
  SEVERITY_ERROR = 4;
  SEVERITY_URGENT = 5;
}

message Toast {
  // Monotonic for this daemon's life; the waiter's cursor.
  uint64 seq = 1;
  // The notification record's id.
  string record_id = 2;
  Severity severity = 3;
  string title = 4;
  string body = 5;
  // The sender: a registered program's id, else the caller's seat.
  string sender = 6;
  int64 at_unix_nano = 7;
  // Filed while Do Not Disturb was on, so it went to the record and not to
  // the screen. Never set on an urgent toast.
  bool suppressed = 8;
  // The reply buttons the sender offered, in order. A toast with replies or
  // reply_text waits for its answer and never closes on its own (section 12,
  // Boris 2026-09-27).
  repeated string replies = 9;
  // The sender takes a free-text reply.
  bool reply_text = 10;
}

// NotifyRequest sends one. Severity is required; title up to 200 bytes, body
// up to 4 KiB.
message NotifyRequest {
  Severity severity = 1;
  string title = 2;
  string body = 3;
  // Up to three reply buttons, each 1 to 40 bytes. The sender learns which
  // was pressed with toast.answer.
  repeated string replies = 4;
  // Offer a free-text reply as well as, or instead of, the buttons.
  bool reply_text = 5;
  // A line written to be heard, up to 400 bytes. Read aloud in place of the
  // title or the body whenever toasts are read aloud at all (section 12, S6).
  string speak = 6;
}

// ToastReplyRequest answers a toast that asked for a reply: a button's label,
// free text, or neither when the person closed it without answering. The
// first reply wins; a second is refused.
message ToastReplyRequest {
  string record_id = 1;
  string reply = 2;
  string text = 3;
  bool dismissed = 4;
}

message ToastReplyResponse {
  ToastAnswer answer = 1;
}

// ToastAnswer is what came back for one toast.
message ToastAnswer {
  string record_id = 1;
  // False while nobody has replied.
  bool answered = 2;
  // The button pressed; empty for a free-text reply or a dismissal.
  string reply = 3;
  string text = 4;
  // Closed without an answer.
  bool dismissed = 5;
  // Who replied: the replying connection's seat.
  string by = 6;
  int64 at_unix_nano = 7;
}

// ToastAnswerRequest waits for the reply to a toast the caller filed, up to
// timeout_ms (at most 60000); zero asks without waiting.
message ToastAnswerRequest {
  string record_id = 1;
  uint32 timeout_ms = 2;
}

message ToastAnswerResponse {
  ToastAnswer answer = 1;
}

message NotifyResponse {
  Toast toast = 1;
}

// ToastWaitRequest answers the toasts after `after` as soon as there are any,
// or an empty list once `timeout_ms` (at most 60000) has passed.
message ToastWaitRequest {
  uint64 after = 1;
  uint32 timeout_ms = 2;
}

message ToastWaitResponse {
  repeated Toast toasts = 1;
  // The newest seq the daemon has issued, so a waiter that starts late can
  // skip the backlog.
  uint64 latest = 2;
}

// Do Not Disturb (section 12): while it is on, a notification is filed in the
// record and not drawn. An urgent one is always drawn.
enum DndChange {
  DND_CHANGE_UNSPECIFIED = 0;
  // Answer the state and change nothing.
  DND_CHANGE_QUERY = 1;
  DND_CHANGE_ON = 2;
  DND_CHANGE_OFF = 3;
}

message ToastDndRequest {
  DndChange change = 1;
}

message ToastDndResponse {
  bool on = 1;
  // Notifications filed and not drawn since Do Not Disturb last went on.
  uint32 suppressed = 2;
}

// Sounds and speech (section 12, S1-S5): the toast sound, reading toasts
// aloud, and one mute over both. The settings survive a restart. A field left
// unspecified changes nothing, so an empty request only asks.
enum SoundMute {
  SOUND_MUTE_UNSPECIFIED = 0;
  SOUND_MUTE_ON = 1;
  SOUND_MUTE_OFF = 2;
}

// How much of a drawn toast is read aloud.
enum ReadAloud {
  READ_ALOUD_UNSPECIFIED = 0;
  READ_ALOUD_OFF = 1;
  READ_ALOUD_TITLE = 2;
  READ_ALOUD_TITLE_AND_BODY = 3;
}

// Which sound a drawn toast plays.
enum ToastSound {
  TOAST_SOUND_UNSPECIFIED = 0;
  TOAST_SOUND_HAIL = 1;
  TOAST_SOUND_BADGE = 2;
  // The file rigd was started with (--toast-sound-file); refused without one.
  TOAST_SOUND_FILE = 3;
}

message SoundRequest {
  SoundMute mute = 1;
  ReadAloud read_aloud = 2;
  ToastSound toast_sound = 3;
  // A percent of full, 1 to 100, for the toast sound and the voice; 0 leaves
  // it as it is.
  uint32 volume = 4;
}

message SoundResponse {
  bool muted = 1;
  ReadAloud read_aloud = 2;
  ToastSound toast_sound = 3;
  // rigd was given a sound file, so TOAST_SOUND_FILE is a choice.
  bool file_set = 4;
  // The player and the speech engine found; empty means none was.
  string player = 5;
  string engine = 6;
  // Why something is silent, in words; empty when nothing is.
  string problem = 7;
  // The volume in force, a percent of full.
  uint32 volume = 8;
}

// SayRequest reads text aloud through the speech engine (S2), behind the
// mute. With wait, the answer comes once it has been heard, up to a bound.
message SayRequest {
  string text = 1;
  bool wait = 2;
}

message SayResponse {
  // With wait: true once the line was heard, or dropped by a mute or a full
  // queue; false when the bound passed first.
  bool heard = 1;
}

// THE HANDS OFF STRIP (plan/05 section 5m, H1-H5). One desktop, so one run at
// a time: a program asks for the pointer and keyboard, a countdown gives the
// person time to decline or hold it, and while it drives he can take it back.
enum HandPhase {
  HAND_PHASE_UNSPECIFIED = 0;
  // Nobody holds the desktop.
  HAND_PHASE_IDLE = 1;
  // A countdown is running; silence is consent (H1).
  HAND_PHASE_ASKING = 2;
  // He held the countdown. It never becomes driving by itself (H2).
  HAND_PHASE_HELD = 3;
  HAND_PHASE_DRIVING = 4;
  // He took the desktop back; only he resumes (H4).
  HAND_PHASE_PAUSED = 5;
}

message HandState {
  // Moves on every change; the strip's long-poll cursor.
  uint64 seq = 1;
  HandPhase phase = 2;
  // The program that asked, off its connection.
  string holder = 3;
  string reason = 4;
  // What the run is doing now: an op and a step number, never typed text.
  string activity = 5;
  // When the run was asked for, and when it started driving.
  int64 asked_unix_nano = 6;
  int64 driving_unix_nano = 7;
  // ASKING: when the countdown ends in driving. HELD: when the hold ends in
  // a decline. PAUSED: when the pause ends the run.
  int64 deadline_unix_nano = 8;
  // The whole countdown, and what was left of it when it was held.
  uint32 window_ms = 9;
  uint32 left_ms = 10;
  // IDLE after a run: how the last one ended (finished, declined, stopped,
  // the program left, paused too long, held too long).
  string ended = 11;
  // DRIVING: the point a step is waiting to act on because the strip covers
  // it (H6). The strip moves to the other edge when it sees one.
  bool has_aim = 12;
  int32 aim_x = 13;
  int32 aim_y = 14;
}

// HandRequestRequest asks for the desktop and blocks through the countdown:
// it answers once the run is driving, and is refused when he declines.
message HandRequestRequest {
  string reason = 1;
  // 10000 to 120000; zero is 20000.
  uint32 countdown_ms = 2;
}

message HandRequestResponse {
  HandState state = 1;
}

// HandStepRequest is the gate before each step: it answers at once while the
// run drives, blocks while he holds the desktop, and is refused once the run
// was stopped.
message HandStepRequest {
  string activity = 1;
  // The root point the step will press or release at, when it has one: a
  // click, a scroll, either end of a drag. The step waits until the strip is
  // not over it (H6).
  bool has_point = 2;
  int32 x = 3;
  int32 y = 4;
}

message HandStepResponse {
  HandState state = 1;
}

message HandReleaseRequest {}

message HandReleaseResponse {
  HandState state = 1;
}

// HandWaitRequest answers the state once its seq is past `after`, or the
// current state once timeout_ms (at most 60000) has passed. Zero answers now.
message HandWaitRequest {
  uint64 after = 1;
  uint32 timeout_ms = 2;
}

message HandWaitResponse {
  HandState state = 1;
}

enum HandAction {
  HAND_ACTION_UNSPECIFIED = 0;
  // Start driving now, without the rest of the countdown.
  HAND_ACTION_ALLOW = 1;
  HAND_ACTION_DECLINE = 2;
  // Freeze the countdown.
  HAND_ACTION_HOLD = 3;
  // Take the desktop back from a run that drives.
  HAND_ACTION_PAUSE = 4;
  // Let a held countdown run on, or a paused run drive again.
  HAND_ACTION_RESUME = 5;
  // End the run, whatever its phase.
  HAND_ACTION_STOP = 6;
}

// HandStripRequest is where the strip is now, from the strip itself, on a
// connection it holds: when that connection closes the rect is forgotten.
// Refused to a program and to an agent, as an answer is.
message HandStripRequest {
  int32 x = 1;
  int32 y = 2;
  int32 width = 3;
  int32 height = 4;
}

message HandStripResponse {
  HandState state = 1;
}

// HandAnswerRequest is the person's answer, from the strip or a terminal.
// Refused to a program and to an agent (H5).
message HandAnswerRequest {
  HandAction action = 1;
}

message HandAnswerResponse {
  HandState state = 1;
}
