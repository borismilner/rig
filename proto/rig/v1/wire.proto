// The rig wire contract, major version 1.
//
// Versioned by major in the path (PLAN.md section 21): rig serves every wire
// major it has ever shipped, so v2 lands beside this file rather than
// replacing it.
//
// Framing is NOT in this file. A frame on the socket is a 4-byte big-endian
// length prefix followed by one encoded Frame. See internal/wire.
syntax = "proto3";

package rig.v1;

option go_package = "github.com/boris-milner/rig/proto/rig/v1;rigv1";

// FrameKind says what a Frame is for.
//
// Zero is UNSPECIFIED and is refused at the daemon boundary rather than
// treated as a default (PLAN.md section 21: "meaningful enum zero is banned").
// A value this binary does not know is refused the same way, so a newer peer
// cannot have an unknown kind silently decode as something harmless.
enum FrameKind {
  FRAME_KIND_UNSPECIFIED = 0;
  FRAME_KIND_REQUEST = 1;      // opens a stream, carries the call
  FRAME_KIND_RESPONSE = 2;     // terminal, carries the result
  FRAME_KIND_STREAM_DATA = 3;  // one frame of a stream that is still open
  FRAME_KIND_STREAM_END = 4;   // terminal, closes a stream with no payload
  FRAME_KIND_ERROR = 5;        // terminal, carries Status
  FRAME_KIND_CANCEL = 6;       // caller-side cancellation of an open stream
}

// Code is a wire-level status. Program-level failure is a RESPONSE payload,
// not an ERROR frame: an ERROR means the call did not reach the program or
// could not be understood.
enum Code {
  CODE_UNSPECIFIED = 0;
  CODE_OK = 1;
  CODE_UNAVAILABLE = 2;        // rig is not there, or is shutting down
  CODE_NOT_FOUND = 3;          // no such program, method or stream
  CODE_INVALID = 4;            // malformed frame, bad argument, unknown enum
  CODE_DENIED = 5;             // refused by capabilities or house rules
  CODE_DEADLINE = 6;           // the call's deadline passed
  CODE_INTERNAL = 7;
}

message Status {
  Code code = 1;

  // The human sentence. Still the thing a terminal prints first, and still
  // the only field a caller can rely on being set.
  string message = 2;

  // Section 9: "A failed call never returns prose. It returns a structured
  // error: what failed, which precondition, what the actual state was, and
  // what would fix it - including, where it exists, the exact command that
  // fixes it." Section 10 then requires --json to return exactly what the MCP
  // tool returns, so these four fields are the shared error object for every
  // surface rather than a CLI rendering. An agent that gets
  //
  //   precondition  shelf.index.path exists
  //   actual        shelf.index.path does not exist
  //   fix           run `rig shelf init`, or set the key
  //   fix_command   rig shelf init
  //
  // does not need a human.
  //
  // ALL FOUR ARE OPTIONAL AND ABSENCE MEANS NOTHING, which is the opposite of
  // a declaration's mandatory properties (section 5e). A precondition nobody
  // can name is better left unsaid than invented: section 9's value is that
  // the field is TRUE when set, and a filled-in guess costs more than a blank.
  // Callers must render only what is present.
  string precondition = 3;
  string actual = 4;
  string fix = 5;

  // Runnable as written, or empty. Never prose - `fix` is where the sentence
  // goes. A surface may offer this as a button or run it after a confirm, so
  // anything here that is not a real command is a defect rather than a hint.
  string fix_command = 6;
}

// Frame is the only thing that crosses the socket.
message Frame {
  // Identifies one logical call. Odd ids are client-opened, even are
  // daemon-opened, so the two sides never collide without negotiation.
  uint32 stream_id = 1;

  FrameKind kind = 2;

  // Dotted method name: "rig.ping", "shelf.reindex". Set on REQUEST only.
  string method = 3;

  // Client-generated, stable across a retry. rig dedups against a bounded
  // window and returns the original response (PLAN.md section 4), so a
  // retried mutating call applies once. Set on REQUEST only.
  string request_id = 4;

  // The encoded body. Its type is implied by method and kind.
  bytes payload = 5;

  // Set on ERROR only.
  Status status = 6;
}

// ---- rig.hello, the handshake that decides what a connection is ------------

// HelloRequest is a program declaring itself on the connection it just opened.
//
// This is the seed of the predicate PLAN.md section 14 rests on: a connection
// that completes the program handshake is a program and is scoped for the life
// of that connection; every other local connection from this uid is a client of
// the owner's and reads everything. Nothing is distributed, minted or
// inherited - the connection itself carries the answer.
//
// M0 routes by name. M1 replaces this with real registration: a declaration
// validated against its schema, with capabilities and a computed projection.
message HelloRequest {
  string program = 1;   // the program's id, e.g. "fakeapp"
  string version = 2;   // its own version string, reported not enforced

  // What this program declares (section 5e). Required: registration is the
  // handshake, not a later call, and a connection that completes it is a
  // program for its whole life. program and version above must agree with
  // identity.id and identity.version, and the daemon refuses them if they do
  // not - two places to say the same thing is two places to disagree.
  Declaration declaration = 3;
}

message HelloResponse {
  string wire = 1;              // the wire major this daemon is serving
  string daemon_version = 2;
  // True once this connection has said hello as a program. It is the whole
  // authorisation state a connection carries: one boolean, set here, with no
  // other way to become either kind of caller (section 14).
  bool scoped = 3;
}

// ---- rig.ping, the one method M0 ships -------------------------------------

message PingRequest {
  // Echoed back verbatim, so a caller can prove the round trip is its own.
  bytes nonce = 1;

  // Which program to probe. Empty, or "rig", means rig itself.
  //
  // The probe is rig's, not the program's. It used to travel as
  // "<program>.ping", which put a reserved command id inside every program's
  // own namespace: a program could not declare `ping` for itself, and nothing
  // reading a command list could tell a declared command from rig's probe,
  // because the bytes did not say which it was. PingRequest and CallRequest
  // are wire-compatible - both are one `bytes` field at tag 1 - so a nonce
  // decodes cleanly as `args` and the difference was unrecoverable at the
  // boundary. Naming the target here makes the probe rig's own method with an
  // argument, which is what it always was.
  //
  // "<program>.ping" still routes, so an older rig keeps working.
  string program = 2;
}

message PingResponse {
  bytes nonce = 1;
  string program = 2;   // who answered
  string version = 3;   // that program's own version string
}

// ---- Registration: what a program declares (PLAN.md section 5e) ------------
//
// Once, at connect, and it is data: no rig code runs inside the program to
// produce it. Everything after identity is optional except coverage,
// semantics_gen and the mandatory command properties.
//
// Every enum below reserves its zero, and here that is not only section 21's
// wire rule: section 5e says no property may have a default that carries a
// safety meaning, because a field whose absence means "safe" can never have
// its default changed without lying about every declaration written before
// the change. So an unset effects is refused rather than read as read-only.

// Coverage says how much of rig a program has adopted (section 5k). The
// honest default is the conservative one, so a program that says nothing is
// partial rather than complete.
enum Coverage {
  COVERAGE_UNSPECIFIED = 0;
  COVERAGE_PARTIAL = 1;
  COVERAGE_FULL = 2;
}

// Effects is what running a command does to the world. Ordered by danger, so
// a house rule written against one level covers everything above it.
//
// EFFECTS_DRIVES_INPUT sits above destructive because it is unbounded in a way
// the levels below are not: a command that deletes files damages what its own
// program can reach, and a command that synthesises a keystroke reaches
// whatever happens to have focus. Without it a house rule cannot say "this
// program may delete its own files but may not type into my windows" - both
// would sit at the same floor and one rule would decide both. Added while the
// wire is still unfrozen; PLAN.md section 21 makes a new value a hard refusal
// at an older daemon's boundary, so the cheap moment to add it is before the
// first wire major and not after.
enum Effects {
  EFFECTS_UNSPECIFIED = 0;
  EFFECTS_READ_ONLY = 1;
  EFFECTS_WRITES_FILES = 2;
  EFFECTS_NETWORK = 3;
  EFFECTS_DESTRUCTIVE = 4;
  EFFECTS_DRIVES_INPUT = 5;
}

// Duration is an order of magnitude, not an estimate. It is what tells a
// surface whether a command belongs on it at all.
enum Duration {
  DURATION_UNSPECIFIED = 0;
  DURATION_INSTANT = 1;
  DURATION_SECONDS = 2;
  DURATION_MINUTES = 3;
  DURATION_HOURS = 4;
}

// Shape is what a result is.
enum Shape {
  SHAPE_UNSPECIFIED = 0;
  SHAPE_UNARY = 1;
  SHAPE_STREAM = 2;
  SHAPE_INTERACTIVE_STREAM = 3;
}

// Tristate is a mandatory boolean that has to have been said. A proto3 bool
// cannot express "the program never declared this", which is exactly what
// section 5e requires these fields to be able to say.
enum Tristate {
  TRISTATE_UNSPECIFIED = 0;
  TRISTATE_NO = 1;
  TRISTATE_YES = 2;
}

message Identity {
  string id = 1;
  string name = 2;
  string version = 3;
  string icon = 4;
  string description = 5;
}

// SensitiveFields wraps the pointer list so absence and emptiness are
// different things on the wire.
//
// A repeated field cannot carry presence in proto3: an empty list and an
// unsent one arrive identically. Section 5e makes sensitive mandatory and
// says it may be empty, so "this command has no sensitive fields" has to be
// distinguishable from "this program never considered the question". The
// wrapper is how: a nil message is the second, a present empty one the first.
message SensitiveFields {
  repeated string pointers = 1;  // JSON pointers into arguments and results
}

// Command is one thing a program can be asked to do.
//
// It declares properties and never surfaces. Section 5e calls this the single
// most important correction in the plan: a command that named its surfaces
// made the surface set a closed vocabulary inside this message, so every
// surface added later cost every program an edit.
message Command {
  string id = 1;
  string title = 2;
  bytes args = 3;                 // JSON Schema for the arguments
  repeated string examples = 4;

  // Mandatory. A registration missing any of these is refused.
  Effects effects = 5;
  Tristate idempotent = 6;        // decides retry, replay, schedule coalescing
  SensitiveFields sensitive = 7;
  Tristate interactive = 8;
  Tristate streams = 9;
  Tristate needs_display = 10;
  Duration duration = 11;
  Tristate confirms = 12;
  Shape shape = 13;
  string summary = 14;
  string description = 15;
  string returns = 16;

  // Planning and promotion hints. Optional, and absence means nothing.
  bool dry_run = 17;
  string cost = 18;
  repeated string preconditions = 19;
  bool promote = 20;
}

message Declaration {
  Identity identity = 1;
  Coverage coverage = 2;
  string coverage_note = 3;

  // Pins what every declared name means, for this program, for its lifetime
  // (section 21). Zero is refused: it cannot be absent.
  int32 semantics_gen = 4;

  repeated string services = 5;   // an unused service costs this program nothing
  string preamble = 6;            // the one document an agent reads first
  repeated Command commands = 7;

  // The scope this program's entries belong to. Empty means the program's own
  // id, which is the only scope a program needs until peers (section 16).
  string scope = 8;

  bool hosted = 9;                // compiled into rigd (section 5j)

  // Where this program serves its own HTML for the window's pane (section
  // 11). Empty means it declares no pane and gets the generated tier.
  //
  // LOOPBACK ONLY, and refused at REGISTRATION rather than at render. A pane
  // url is not a rendering detail: whatever is here is what a webview inside
  // rig will load, so a program that could name any origin could point the
  // window at anything. Section 5h's R7 puts the same class of check at
  // registration - "using an element rig has removed fails at registration" -
  // because a refusal at render happens in front of the user, which is the
  // thing R7 exists to prevent.
  //
  // http or https, and the host must be 127.0.0.1, ::1 or localhost. A unix
  // socket would need the window to proxy it, and section 23's M8 row is
  // explicit that the estate already serves localhost SPAs.
  string pane_url = 10;

  // The kit elements this program's own page uses (section 5h R3).
  //
  // A REGISTRATION DECLARATION, not a rendering hint, and there is one
  // authority for it so the check has somewhere to run. R7: a name rig does
  // not serve refuses the REGISTRATION, because the alternative fails at
  // render, in front of the user, on the surface whose entire product is
  // presentation.
  //
  // Strings rather than an enum, and R1 is the reason. The inventory is open
  // while the only adopters are fake, and adding an element has to stay "a
  // normal change" - an enum would make every new element a wire change, and
  // section 21's rule is that an unknown enum value is a hard refusal at the
  // daemon boundary. A name rig does not know is refused either way; the
  // difference is whether adding one costs a wire major.
  //
  // Config may SUBTRACT from this list and never add to it (R3). Subtraction
  // arrives with config at M4; today the declared list is the whole list.
  repeated string elements = 11;
}

// Program is one program as one principal may see it (section 14).
//
// It is Declaration minus preamble and scope: what a reader is shown, not
// what was stored. Section 5k's rule that no surface may imply completeness
// is why coverage travels with it.
message Program {
  Identity identity = 1;
  Coverage coverage = 2;
  string coverage_note = 3;
  int32 semantics_gen = 4;
  repeated string services = 5;
  bool hosted = 6;
  repeated Command commands = 7;

  // Where this program serves its own pane, validated at registration. A
  // reader gets it because the window is a reader like any other.
  string pane_url = 8;

  // The kit elements this program declares (section 5h R3). A reader gets it
  // for the same reason it gets services: it is part of what the program said
  // about itself, not part of how anything draws it.
  repeated string elements = 9;
}

// ---- rig.programs, the read side of the registry ---------------------------

message ProgramsRequest {}

message ProgramsResponse {
  // Only what the calling principal may see. An unscoped, unprivileged client
  // gets nothing; a program gets itself; a client of the owner's gets all of
  // it, because introspect was decided when the connection was made.
  repeated Program programs = 1;
}

// ---- rig.down, stopping the daemon (PLAN.md section 5f) --------------------
//
// A method rather than a signal, and that is the whole decision. The cheap
// alternative was for the CLI to read rigd.pid and send SIGTERM itself, which
// loses twice: it skips the house-rules floor at the single most destructive
// call any surface can make - the gap serveSelf used to have and no longer
// does - and the pid file outlives its own process, because a SIGTERM'd rigd
// exits 0 and removes the socket but leaves the file behind pointing at
// nothing. Stopping the daemon travels the same path as every other call.
//
// It is destructive and it is idempotent: the estate ends up stopped either
// way, which is exactly what idempotent means here.

message DownRequest {}

message DownResponse {
  // Who is stopping, so the answer names what it acted on rather than saying
  // "ok". Two estates run on this machine under different XDG_RUNTIME_DIRs
  // and `pgrep -x rigd` cannot tell them apart, so the pid is the only thing
  // in the answer that identifies WHICH daemon just agreed to stop.
  int32 pid = 1;
  string version = 2;
}

// ---- Invoking a declared command (PLAN.md section 5e, M1 slice 5) ----------
//
// One message pair for EVERY declared command, of every program, forever.
// The alternative - a request type per command - would make adding a command
// a wire change, and section 5e's whole argument is that a program declares
// data rather than shipping code: rig has never seen this command's arguments
// and does not need a type for them.
//
// So arguments and results are JSON, and the contract is the JSON Schema the
// program declared in Command.args. rig validates against that schema at the
// boundary, which is why an unknown field is an error the caller can act on
// rather than something silently dropped between two proto versions.

message CallRequest {
  // A JSON object. Empty means no arguments, and is distinct from `{}` only
  // in that both validate the same way against the declared schema.
  bytes args = 1;
}

message CallResponse {
  // A JSON value, shaped however the command's `returns` describes. rig does
  // not interpret it: section 5d says the client is a dumb pipe, and a daemon
  // that reshaped a program's own result would be the opposite.
  bytes result = 1;
}
