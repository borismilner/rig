<!doctype html>
<meta charset="utf-8">
<title>focus pass selftest</title>
<!--
  Known answers for pass-focus.mjs. Every colour here is a literal hex with no
  theme, no opacity and no color-mix, so the pass must report exactly these
  values. If it reports anything else the instrument is lying, and a lying
  instrument is worse than no gate at all.

  #ffffff ground.  Rings:
    ok       #949494  3.03:1  - passes 1.4.11 by a hair
    low      #c0c0c0  1.82:1  - fails
    none     no focus style at all - must be reported as no-indicator
    visible  ring only on :focus-visible - must still be SEEN, which is the
             whole reason the pass dispatches a real Tab first
    silenced #c0c0c0 (1.82:1) with data-contrast-ok - must land in silenced, not failures
-->
<style>
  html, body { background: #ffffff; margin: 0; padding: 40px; }
  button {
    display: block; margin: 30px 0; width: 200px; height: 40px;
    background: #ffffff; color: #111111; border: 1px solid #111111;
    font: 16px/1.4 system-ui, sans-serif;
  }
  /* a bare duration would mean `transition: all` and animate colour on a theme
     flip; there is no theme here, and the pass settles anyway */
  #ok:focus-visible      { outline: 4px solid #949494; outline-offset: 2px; }
  #low:focus-visible     { outline: 4px solid #c0c0c0; outline-offset: 2px; }
  #none:focus            { outline: none; }
  #visible:focus-visible { outline: 4px solid #949494; outline-offset: 0; }
  #silenced:focus-visible{ outline: 4px solid #c0c0c0; outline-offset: 2px; }
</style>
<button id="ok">ok 3.03</button>
<button id="low">low 1.82</button>
<button id="none">no indicator</button>
<button id="visible">focus-visible only</button>
<button id="silenced" data-contrast-ok="known, deliberate, tested here">silenced</button>
